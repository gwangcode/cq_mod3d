name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies (for CadQuery OCP)
      run: |
        sudo apt-get update
        # 注意这里：libgl1-mesa-glx 已经改成了 libgl1
        sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libglib2.0-0
        python -m pip install --upgrade pip
        pip install pytest matplotlib
        pip install -e .
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
        
    - name: Test with pytest
      run: |
        pytest tests/

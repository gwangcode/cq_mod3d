[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cq_mod3d"
version = "0.1.0"
description = "A procedural geometry, transformation, and noise generator for CadQuery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gang Wang", url = "https://github.com/gwangcode" }
]
keywords = ["cadquery", "3d", "cad", "procedural", "noise", "mesh"]
dependencies = [
    "cadquery>=2.3.0",
    "numpy",
    "scipy",
    "trimesh",
    "shapely"
]

[project.urls]
"Homepage" = "https://github.com/gwangcode/cq_mod3d"
"Bug Tracker" = "https://github.com/gwangcode/cq_mod3d/issues"

[tool.setuptools.packages.find]
include = ["cq_mod3d*"]
